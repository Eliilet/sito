<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: hero a tutta larghezza con onde animate; sezioni a colonna centrale; prenotazione a due colonne su desktop */
:root{
  --navy:rgb(11,30,51); --deep:rgb(7,20,36); --sea:rgb(26,110,128); --foam:rgb(89,195,195);
  --sail:rgb(244,246,248); --signal:rgb(255,200,61); --ink:rgb(16,28,44); --muted:rgb(88,104,124);
  --line:rgb(222,229,236); --bg:rgb(247,249,251); --card:rgb(255,255,255);
  --display:"Syne","Avenir Next",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:rgb(232,238,245);--muted:rgb(150,166,186);--line:rgb(36,52,72);--bg:rgb(8,18,30);--card:rgb(14,28,45);color-scheme:dark}}
:root[data-theme="dark"]{--ink:rgb(232,238,245);--muted:rgb(150,166,186);--line:rgb(36,52,72);--bg:rgb(8,18,30);--card:rgb(14,28,45);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.demo{background:var(--signal);color:var(--deep);font-size:.85rem;font-weight:700;text-align:center;padding:7px 16px}
header{position:sticky;top:0;z-index:20;background:rgba(11,30,51,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--sail);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;text-decoration:none}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:22px;margin-left:auto}
nav a{text-decoration:none;font-weight:600;font-size:.95rem;opacity:.85}
nav a:hover{opacity:1}
.lang{display:flex;border:1px solid rgba(244,246,248,.3);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--sail);font:700 .8rem var(--body);padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sail);color:var(--navy)}
.cta{background:var(--signal);color:var(--deep);border:0;border-radius:999px;padding:12px 22px;font:800 1rem var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.cta:hover{filter:brightness(1.05)}
.hero{position:relative;background:linear-gradient(180deg,var(--navy) 0%,var(--sea) 100%);color:var(--sail);overflow:hidden}
.hero canvas{position:absolute;inset:auto 0 0 0;width:100%;height:46%;display:block}
.hero .wrap{position:relative;padding-block:72px 220px}
.kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--foam)}
.hero h1{font-size:clamp(2.8rem,8vw,6.2rem);font-weight:800;margin:14px 0 18px;max-width:11ch}
.hero p{font-size:1.15rem;max-width:44ch;opacity:.9;margin:0 0 28px}
.hero .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ghost{color:var(--sail);text-decoration:none;font-weight:700;border-bottom:2px solid var(--foam);padding-bottom:2px}
.boat{position:absolute;right:8%;bottom:28%;width:min(30vw,260px);transform-origin:50% 90%;transition:transform .3s ease-out;pointer-events:none}
.wind{position:absolute;right:20px;top:24px;font-size:.8rem;font-weight:700;opacity:.8;display:flex;align-items:center;gap:8px}
.wind svg{width:26px;height:26px;transition:transform .4s}
section{padding-block:84px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.sh h2{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800}
.sh p{max-width:46ch;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.xp{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.xp .ill{height:120px;border-radius:14px;background:linear-gradient(160deg,var(--sea),var(--navy));display:grid;place-items:center}
.xp .ill svg{width:72%;height:auto}
.xp h3{font-size:1.35rem;font-weight:700}
.xp .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.xp p{margin:0;color:var(--muted);font-size:.95rem}
.price{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:8px}
.price b{font-family:var(--display);font-size:1.6rem}
.price small{color:var(--muted);font-weight:600}
.btn{background:var(--navy);color:var(--sail);border:0;border-radius:12px;padding:10px 14px;font:700 .9rem var(--body);cursor:pointer}
:root[data-theme="dark"] .btn{background:var(--sail);color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--sail);color:var(--navy)}}
.routes{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
.map{background:var(--navy);border-radius:24px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto}
.rtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rtab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:700 .9rem var(--body);cursor:pointer;color:var(--ink)}
.rtab[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--deep)}
.stops{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.stops li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.stops .n{width:28px;height:28px;border-radius:50%;background:var(--sea);color:var(--sail);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.stops b{display:block}
.stops small{color:var(--muted)}
.rinfo{color:var(--muted);margin:0 0 14px}
#path{stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.6s ease}
.book{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.f{display:grid;gap:8px;margin-bottom:18px}
.f>label,.lbl{font-weight:700;font-size:.9rem}
select,input[type=date]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 1rem var(--body)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font:700 .9rem var(--body);cursor:pointer;color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--navy);color:var(--sail);border-color:var(--navy)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:800 1.2rem var(--body);cursor:pointer;color:var(--ink)}
.qty output{font-family:var(--display);font-size:1.5rem;min-width:2ch;text-align:center}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex input{width:20px;height:20px;accent-color:var(--sea)}
.ex span{flex:1}
.sum{position:sticky;top:90px;background:var(--navy);color:var(--sail);border-radius:24px;padding:24px}
.sum h3{font-size:1.4rem;margin-bottom:14px}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 18px;font-size:.95rem}
.sum dt{opacity:.7}.sum dd{margin:0;text-align:right;font-weight:600}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(244,246,248,.2);padding-top:14px;margin-bottom:18px}
.tot b{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.sum .cta{width:100%;justify-content:center}
.sum .cta[disabled]{opacity:.45;cursor:not-allowed}
.sec{display:flex;gap:8px;align-items:center;font-size:.8rem;opacity:.75;margin-top:12px;justify-content:center}
.err{color:var(--signal);font-size:.85rem;min-height:1.2em;margin-top:8px;text-align:center}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 20px;margin-bottom:10px}
.faq summary{font-weight:700;padding:14px 0;cursor:pointer}
.faq p{margin:0 0 16px;color:var(--muted)}
footer{background:var(--deep);color:var(--sail);padding-block:48px 40px}
footer .cols{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer small{opacity:.6}
.modal{position:fixed;inset:0;background:rgba(7,20,36,.7);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--card);color:var(--ink);border-radius:24px;padding:26px;max-width:440px;width:100%}
.modal h3{font-size:1.5rem;margin-bottom:10px}
.modal p{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap}
.modal .acts button{flex:1}
.ok{width:56px;height:56px;border-radius:50%;background:var(--foam);display:grid;place-items:center;margin-bottom:14px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
@media (max-width:860px){nav{display:none}.routes,.book{grid-template-columns:1fr}.sum{position:static}.boat{right:6%;bottom:16%;width:30vw}.hero .wrap{padding-block:40px 230px}.wind{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#path{transition:none}.boat,.wind svg{transition:none}}
</style>
</head>

let L=(()=>{try{return localStorage.getItem("ww.lang")}catch(e){}})()||(navigator.language||"it").slice(0,2);if(!T[L])L="en";

const ICON={sail:'<svg viewBox="0 0 120 80"><path d="M58 6v56H24z" fill="rgb(244,246,248)"/><path d="M63 18v44h30z" fill="rgb(255,200,61)"/><path d="M14 64h92l-10 12H24z" fill="rgb(244,246,248)"/></svg>',

 map:'<svg viewBox="0 0 120 80"><path d="M14 16l28-8 36 10 28-8v56l-28 8-36-10-28 8z" fill="rgb(244,246,248)" opacity=".9"/><path d="M30 58c14-20 30 4 44-14s14-18 22-20" stroke="rgb(255,200,61)" stroke-width="4" fill="none" stroke-dasharray="6 6"/></svg>'};
const st={xp:"vela_mezza",date:"",slot:"",q:2,ex:new Set(),route:"r1"};
const xpOf=id=>XP.find(x=>x.id===id);
const eur=n=>"€"+n.toLocaleString(L==="it"?"it-IT":"en-GB");

function i18n(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
 $("#port").textContent=CONFIG.port;
 renderXp();renderRoutes();renderBook();renderFaq();
}
function renderXp(){
 $("#xps").innerHTML=XP.map(x=>'<article class="xp"><div class="ill">'+ICON[x.icon]+'</div><h3>'+nm(x.n)+'</h3><div class="meta"><span class="pill">'+nm(x.dur)+'</span><span class="pill">'+t("max")+' '+x.max+'</span></div><p>'+nm(x.d)+'</p><div class="price"><span>'+(x.type==="quote"?'<small>'+t("quote")+'</small>':'<b>'+eur(x.price)+'</b> <small>'+t(x.type)+'</small>')+'</span><button class="btn" data-pick="'+x.id+'">'+t("book")+'</button></div></article>').join("");
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{st.xp=b.dataset.pick;st.slot="";st.ex.clear();st.q=xpOf(st.xp).type==="boat"?1:2;renderBook();$("#prenota").scrollIntoView()});
}
function renderRoutes(){
 const r=ROUTES.find(x=>x.id===st.route);
 $("#rtabs").innerHTML=ROUTES.map(x=>'<button class="rtab" data-r="'+x.id+'" aria-pressed="'+(x.id===st.route)+'">'+nm(x.n)+'</button>').join("");
 $("#rinfo").textContent=nm(r.h);
 $("#stops").innerHTML=r.s.map((s,i)=>'<li><span class="n">'+(i+1)+'</span><div><b>'+nm(s)+'</b></div></li>').join("");
 const p=$("#path");p.style.transition="none";p.setAttribute("d",r.p);p.style.strokeDashoffset=1200;p.getBoundingClientRect();p.style.transition="";requestAnimationFrame(()=>p.style.strokeDashoffset=0);
 $("#pins").innerHTML=r.stops.map((c,i)=>'<g transform="translate('+c[0]+' '+c[1]+')"><circle r="14" fill="'+(i?'rgb(255,200,61)':'rgb(89,195,195)')+'"/><text y="5" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="13" fill="rgb(7,20,36)">'+(i+1)+'</text></g>').join("");
 document.querySelectorAll(".rtab").forEach(b=>b.onclick=()=>{st.route=b.dataset.r;renderRoutes()});
}
function renderBook(){
 const x=xpOf(st.xp);
 $("#bxp").innerHTML=XP.map(o=>'<option value="'+o.id+'"'+(o.id===st.xp?" selected":"")+'>'+nm(o.n)+'</option>').join("");
 $("#slots").innerHTML=x.slots.length?x.slots.map(s=>'<button class="slot" data-s="'+s+'" aria-pressed="'+(s===st.slot)+'">'+s+'</button>').join(""):'<small style="color:var(--muted)">—</small>';
 document.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{st.slot=b.dataset.s;renderBook()});
 st.q=Math.min(Math.max(1,st.q),x.type==="boat"?3:x.max);
 $("#qlbl").textContent=x.type==="boat"?t("boats"):t("people");$("#qn").textContent=st.q;$("#qmax").textContent=t("max")+" "+(x.type==="boat"?3:x.max);
 const ok=e=>e.only?e.only.includes(x.id):(!e.pp||x.type==="pp");const ex=EXTRAS.filter(ok);
 $("#extras").innerHTML=ex.map(e=>'<label class="ex"><input type="checkbox" data-e="'+e.id+'"'+(st.ex.has(e.id)?" checked":"")+'><span>'+nm(e.n)+'</span><b>+'+eur(e.price)+(e.pp?' <small>'+t("pp")+'</small>':'')+'</b></label>').join("");
 document.querySelectorAll("[data-e]").forEach(c=>c.onchange=()=>{c.checked?st.ex.add(c.dataset.e):st.ex.delete(c.dataset.e);summary()});
 summary();
}
const okx=(e,x)=>e.only?e.only.includes(x.id):(!e.pp||x.type==="pp");
function total(){const x=xpOf(st.xp);let s=x.price*st.q;EXTRAS.forEach(e=>{if(st.ex.has(e.id)&&okx(e,x))s+=e.pp?e.price*st.q:e.price});return s}
function summary(){
 const x=xpOf(st.xp),exn=EXTRAS.filter(e=>st.ex.has(e.id)&&okx(e,x)).map(e=>nm(e.n));
 const d=st.date?new Date(st.date+"T12:00").toLocaleDateString(L==="it"?"it-IT":"en-GB",{weekday:"short",day:"numeric",month:"long"}):"—";
 $("#sumdl").innerHTML='<dt>'+t("dXp")+'</dt><dd>'+nm(x.n)+'</dd><dt>'+t("dDate")+'</dt><dd>'+d+'</dd><dt>'+t("dSlot")+'</dt><dd>'+(st.slot||"—")+'</dd><dt>'+t("dQty")+'</dt><dd>'+st.q+' '+(x.type==="boat"?(L==="it"?(st.q===1?"barca":"barche"):(st.q===1?"boat":"boats")):(L==="it"?(st.q===1?"persona":"persone"):(st.q===1?"person":"people")))+'</dd><dt>'+t("dEx")+'</dt><dd>'+(exn.join(", ")||t("none"))+'</dd>';
 $("#tot").textContent=x.type==="quote"?t("quote"):eur(total());
 $("#pay").textContent=x.type==="quote"?t("ask"):t("pay")+" "+eur(total());
 $("#err").textContent="";
}
function renderFaq(){$("#faqs").innerHTML=t("faq").map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join("")}
function check(){
 const x=xpOf(st.xp);if(!st.date)return t("needDate");
 const d=new Date(st.date+"T12:00"),now=new Date();now.setHours(0,0,0,0);
 if(d<now)return t("past");if(d.getMonth()<3||d.getMonth()>9)return t("offs");
 if(x.slots.length&&!st.slot)return t("needSlot");return "";
}
function modal(h,p){$("#mt").textContent=h;$("#mp").textContent=p;$("#mclose").textContent=t("close");$("#modal").hidden=false;$("#mclose").focus()}
$("#mclose").onclick=()=>$("#modal").hidden=true;
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").hidden=true});

 const e=check();if(e){$("#err").textContent=e;return}

 const link=CONFIG.stripe[x.id];
 if(link){const u=new URL(link);u.searchParams.set("client_reference_id",(x.id+"_"+st.date+"_"+st.slot).replace(/[^\w-]/g,"-"));location.href=u.toString();return}
 modal(t("mDemoT"),t("mDemo"));
};
$("#bxp").onchange=e=>{st.xp=e.target.value;st.slot="";st.ex.clear();st.q=xpOf(st.xp).type==="boat"?1:2;renderBook()};

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("ww.lang",L)}catch(e){}i18n()});
(()=>{const d=new Date();$("#bdate").min=d.toISOString().slice(0,10)})();

/* Onde animate: l'ampiezza e l'inclinazione della barca seguono il puntatore */
const cv=$("#sea"),cx=cv.getContext("2d"),boat=$("#boat"),arrow=$("#arrow");
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W,H,amp=14,target=14,tm=0;
function size(){const r=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
size();addEventListener("resize",size);
document.querySelector(".hero").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect(),k=(e.clientX-r.left)/r.width;target=8+k*26;boat.style.transform="rotate("+((k-.5)*14)+"deg)";arrow.style.transform="rotate("+(200+k*60)+"deg)"});
function draw(){
 amp+=(target-amp)*.04;tm+=still?0:.018;cx.clearRect(0,0,W,H);
 const layers=[["rgba(89,195,195,.35)",.25,1.0],["rgba(26,110,128,.85)",.45,1.4],[getComputedStyle(document.body).backgroundColor,.7,1.8]];
 layers.forEach(([c,y0,sp],i)=>{cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=8){const y=H*y0+Math.sin(x*.012+tm*sp+i)*amp*(1-i*.2)+Math.sin(x*.031+tm*sp*1.7)*amp*.35;cx.lineTo(x,y)}cx.lineTo(W,H);cx.closePath();cx.fillStyle=c;cx.fill()});
 if(!still)boat.style.translate="0 "+(Math.sin(tm*1.4)*amp*.35)+"px";
 requestAnimationFrame(draw)}
draw();
i18n();
</script>
